[project]
name = "task-logging"
version = "0.0.1"
description = ""
authors = [{ name = "zhangzhong", email = "im.zhong@outlook.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["task", "logging"]

[project.urls]
Homepage = "https://github.com/im-zhong/task-logging"
Repository = "https://github.com/im-zhong/task-logging"
Issues = "https://github.com/im-zhong/task-logging/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0,<5.0.0",
    "ruff>=0.9.9,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
fix = true
# Pin lint target to the lowest supported runtime so version-aware rules
# (UP, FA, PYI, …) judge the code against 3.10's syntax/library surface
# rather than the developer's local interpreter.
target-version = "py310"


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "ERA",
    "PGH",
    "RUF003",
    "E501",
    "COM",
    "FA102",
    "T20",
    "TD",
    "FIX",
    "BLE",
    "S",
    "G",
    "TC",
    "RUF001", # https://docs.astral.sh/ruff/rules/ambiguous-unicode-character-string/
    "ANN001", # https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
    "ANN002", # https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
    "ANN003", # https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
    "RUF002",
    "ANN401", # https://docs.astral.sh/ruff/rules/any-type/
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use raw literals, raise inline, and skip return annotations.
"tests/*" = ["ANN201", "ANN202", "EM101", "EM102", "PLR2004", "TRY301", "INP001"]
# `_render_exc_info` mirrors stdlib's `logging.Formatter` signature, which uses bool|tuple.
"task_logging/formatters.py" = ["FBT001"]


[tool.mypy]
strict = true
# Type-check against the lowest supported version so we can't accidentally
# rely on stdlib stubs or typing constructs only present on newer runtimes.
python_version = "3.10"


# https://docs.astral.sh/uv/guides/package/
